name: Desktop package
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: desktop-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
            script: desktop:dist:win:x64
            artifacts: |
              apps/desktop/dist/CUC-Manchuang-Windows-x64.exe
              apps/desktop/dist/*.blockmap
              apps/desktop/dist/latest.yml
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      DSH_TELEMETRY_DISABLED: '1'
      npm_config_replace_registry_host: registry.npmmirror.com
      npm_config_loglevel: info
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Mantur client and desktop carrier
        run: pnpm run build:mantur
      - name: Test desktop launch contract
        run: pnpm exec vitest run apps/desktop/tests/runtime.spec.ts scripts/client-build-environment.client.spec.ts apps/desktop/tests/native-account-broker.spec.ts apps/desktop/tests/native-account-descriptor.spec.ts packages/credentials/authorization-manturhub/tests/native.spec.ts scripts/mantur-skills-resources.spec.ts
      - name: Verify Windows sandbox startup without a parent console
        if: runner.os == 'Windows'
        run: pnpm exec vitest run packages/sandbox/sandbox-windows-acl/tests/runner.spec.ts packages/sandbox/sandbox-windows-acl/tests/console.spec.ts
      - name: Restore pinned Mantur Cut source cache
        uses: actions/cache@v5
        with:
          path: .cache/mantur-cut
          key: mantur-cut-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/mantur-cut/source.json', 'packages/client/ui-mantur-editing/adapters/mantur-cut.patch', 'packages/client/ui-mantur-editing/adapters/mantur-cut-packaged.patch') }}
      - name: Require native compiler
        if: runner.os == 'macOS'
        run: xcrun clang --version
      - name: Use CUC name in installer and packaged smoke
        shell: pwsh
        run: |
          $manifestPath = 'apps/desktop/package.json'
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $manifest.build.productName = 'CUC漫创'
          $manifest.build.win.artifactName = 'CUC-Manchuang-Windows-x64.exe'
          $manifest | ConvertTo-Json -Depth 30 | Set-Content $manifestPath -Encoding utf8NoBOM
          $smokePath = 'apps/desktop/scripts/smoke-packaged.ts'
          $smoke = [System.IO.File]::ReadAllText($smokePath).Replace('ManTur Agent', 'CUC漫创')
          [System.IO.File]::WriteAllText($smokePath, $smoke)
      - name: Build native installer
        run: pnpm run ${{ matrix.script }}
      - name: Smoke packaged dependency closure
        run: pnpm run desktop:smoke
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 7
